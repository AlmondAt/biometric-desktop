# ============================================
# Raspberry Pi 5 + Arduino Nano Configuration
# ============================================

# Serial Communication
serial:
  arduino_port: "/dev/ttyUSB0"  # Arduino Nano serial port
  arduino_baudrate: 115200
  fingerprint_port: "/dev/ttyUSB1"  # AS608/R307 sensor
  fingerprint_baudrate: 57600
  timeout: 1.0

# Camera Configuration
camera:
  devices: ['/dev/video0', 0]  # OpenCV devices to try
  width: 640
  height: 480
  use_rpicam: true  # use rpicam-jpeg CLI fallback when OpenCV fails
  rpicam_timeout: 10  # ⬆️ INCREASED from 1 → 10 (rpicam-jpeg actual capture time ~10s per frame)

# Biometric Settings
biometric:
  fingerprint_timeout: 15  # seconds (increased from 12 to handle sensor initialization delay)
  face_timeout: 45  # ⬆️ INCREASED from 20 → 45 (rpicam needs ~10s per frame × 4 frames max + processing)
  face_threshold: 0.8  # ⬆️ INCREASED from 0.7 for better security (industry standard 0.8-0.9)
  stable_frames: 2  # require 2 consistent frames before accepting match (stable enough with 45s timeout)

# Touch Sensor
touch:
  debounce_ms: 200

# Keypad Input
keypad:
  input_timeout: 20  # seconds per field

# Relay/Door Control
relay:
  open_duration: 10  # seconds
  
# Database Paths
database:
  sqlite_path: "biometrics.db"
  embeddings_path: "database/embeddings.pkl"
  
# Logging
logging:
  log_folder: "logs"
  events_log: "logs/events.log"
  access_log: "logs/access.log"
  pending_csv: "logs/absensi_pending.csv"
  unknown_faces: "logs/unknown_faces"

# Google Sheets Integration
google_sheets:
  web_app_url: ""  # isi dengan Google Apps Script Web App URL lokal
  retry_interval: 300  # seconds (5 minutes)
  max_retries: 3

# LCD Display
lcd:
  update_delay: 0.15  # minimum delay between updates (seconds)

# System Timeouts
timeouts:
  splash_duration: 5  # seconds
  message_display: 3  # seconds
  
# Job Codes (for attendance menu)
job_codes:
  "1": "PS Muro"
  "2": "Dasar Menengah"
  "3": "Lanjut"

# Domain Codes (for attendance menu)
domain_codes:
  "A": "Lab Depok"
  "B": "Lab Kalimalang"
  "C": "Lab Karawaci"
